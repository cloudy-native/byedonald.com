name: Daily News Update

on:
  schedule:
    # Runs every day at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC
      contents: write # Required to commit changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # pnpm 11 requires Node.js >= 22.13 (uses node:sqlite)
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::607477397669:role/ByeDonald3Stack-GitHubActionsRole4F1BBA26-11Rv3x2wQC4I
          aws-region: ${{ vars.AWS_REGION }}

      - name: Fetch latest news
        run: pnpm run backfill-newsapi.org
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}

      - name: Tag new articles
        run: pnpm run tag-news

      - name: Normalize tags
        run: pnpm run normalize-tags

      - name: Move articles to correct date files
        run: pnpm run move-articles-to-correct-date

      - name: Check for changes
        id: git-check
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "feat: daily news update" || echo "No changes to commit"
          git push

      # Always rebuild/deploy so the site stays current even when no new JSON landed.
      - name: Build site
        run: pnpm run build
        env:
          # Astro client-exposed Algolia vars. Fall back to legacy GATSBY_* repo vars if set.
          PUBLIC_ALGOLIA_APP_ID: ${{ vars.PUBLIC_ALGOLIA_APP_ID || vars.GATSBY_ALGOLIA_APP_ID }}
          PUBLIC_ALGOLIA_API_KEY: ${{ secrets.PUBLIC_ALGOLIA_API_KEY || secrets.GATSBY_ALGOLIA_API_KEY || vars.GATSBY_ALGOLIA_API_KEY }}
          PUBLIC_ALGOLIA_INDEX_NAME: ${{ vars.PUBLIC_ALGOLIA_INDEX_NAME || vars.GATSBY_ALGOLIA_INDEX_NAME }}

      - name: Deploy to S3
        run: pnpm run deploy

      - name: Invalidate CloudFront
        run: >
          aws cloudfront create-invalidation
          --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          --paths "/*"
